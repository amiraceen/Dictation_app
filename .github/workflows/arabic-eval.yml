name: Arabic accuracy test

# Scores Whisper models on real Arabic speech (Google FLEURS ar_eg) on a GitHub Mac:
# word error rate, character error rate and speed. Results appear in the run's
# summary page and as an artifact. Runs when the test changes, or by hand.
on:
  push:
    paths: ["tools/eval_arabic.py", "arabic.py", ".github/workflows/arabic-eval.yml"]
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated faster-whisper models"
        default: "small,medium,large-v3-turbo,large-v3"
      clips:
        description: "Number of clips"
        default: "40"
      set:
        description: "Optional: path in the repo to an exported voice-test.zip (scored instead of FLEURS)"
        default: ""

jobs:
  eval:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache models and test audio
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: arabic-eval-v1
      - name: Install
        run: python -m pip install --quiet faster-whisper jiwer huggingface_hub numpy soundfile
      - name: Score models
        run: |
          python tools/eval_arabic.py \
            --models "${{ github.event.inputs.models || 'small,medium,large-v3-turbo,large-v3' }}" \
            --clips "${{ github.event.inputs.clips || '40' }}" \
            --set "${{ github.event.inputs.set || '' }}" --out arabic_results.md
          cat arabic_results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-results
          path: arabic_results.md
